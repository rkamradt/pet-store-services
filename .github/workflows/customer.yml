name: "Build customer"

on:
  push:
    branches:
      - main
    paths:
      - "customer/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./customer
          push: true
          tags: ghcr.io/rkamradt/customer:main
